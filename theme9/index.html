<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Linking to Theme 3 CSS -->
    <title>Leven Portfolio - Theme 3</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h2>Leven</h2>
            </div>
            <ul class="nav-links">
                <li><a href="#about" class="active">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content">
        <section class="hero" id="about">
            <div class="hero-content">
                <h1>Welcome to My Portfolio</h1>
                <p>Your go-to resource for creative web development.</p>
                <button class="btn primary">View My Work</button>
            </div>
        </section>

        <section class="projects" id="projects">
            <h2>My Projects</h2>
            <div class="project-grid">
                <div class="project-card">
                    <h3>Project 1</h3>
                    <p>A brief description of Project 1.</p>
                </div>
                <div class="project-card">
                    <h3>Project 2</h3>
                    <p>A brief description of Project 2.</p>
                </div>
                <div class="project-card">
                    <h3>Project 3</h3>
                    <p>A brief description of Project 3.</p>
                </div>
            </div>
        </section>

        <section class="contact" id="contact">
            <h2>Contact Me</h2>
            <form action="#" method="POST">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" rows="5" required></textarea>
                <button type="submit" class="btn secondary">Send Message</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script> <!-- Linking to Theme 3 JavaScript -->
</body>
</html>
